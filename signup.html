<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign up - Genverse</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">Genverse</a>
      <div class="nav-links">
        <a href="login.html">Login</a>
      </div>
    </div>
  </nav>

  <main class="center-card">
    <div class="card">
      <h2>Create account</h2>
      <input id="email" placeholder="Email" type="email">
      <input id="password" placeholder="Password" type="password">
      <button id="signupBtn" class="btn">Create account</button>
      <p class="muted">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <script type="module">
    import { signUpWithEmail } from "./js/auth.js";

    const signupBtn = document.getElementById('signupBtn');
    const email = document.getElementById('email');
    const password = document.getElementById('password');

    signupBtn.onclick = () => signUpWithEmail(email.value, password.value);
  </script>
</body>
</html>
