<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Genverse</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  </head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">Genverse</a>
      <div class="nav-links">
        <a href="signup.html">Sign up</a>
      </div>
    </div>
  </nav>

  <main class="center-card">
    <div class="card">
      <h2>Login</h2>
      <input id="email" placeholder="Email" type="email">
      <input id="password" type="password" placeholder="Password">
      <button id="loginBtn" class="btn">Login</button>
      <p class="muted">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

  <script type="module">
    import { signInWithEmail } from "./js/auth.js";

    const loginBtn = document.getElementById('loginBtn');
    const email = document.getElementById('email');
    const password = document.getElementById('password');

    loginBtn.onclick = () => signInWithEmail(email.value, password.value);
  </script>
</body>
</html>
